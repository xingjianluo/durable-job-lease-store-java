server.port=8080

# ---- 租约与重试（本地演示取值较小，便于观察回收） ----
durable.lease-ttl=30s
durable.renew-ttl=30s
durable.max-attempts=3
durable.backoff-base=2s
durable.backoff-max=60s
durable.backoff-multiplier=2.0
durable.reaper-interval=5s

# ---- 游标 ----
durable.cursor-ttl=10m
durable.cursor-secret=durable-job-local-dev-secret

# ---- 文件持久化（本地工程目录，重启后自动恢复） ----
durable.store-file=data/task-store.json
