# 随机端口便于本地共存；需要固定端口可改为 8080
server.port=0

# ===== 租约与重试参数 =====
# 单次租约时长（毫秒）
job.lease-ttl-millis=30000
# 回收器扫描间隔（毫秒）
job.reaper-interval-millis=1000
# 最大尝试次数（含首次执行）
job.max-attempts=3
# 失败重试指数退避：第 n 次重派等待 min(base*2^(n-1), max)
job.base-backoff-millis=2000
job.max-backoff-millis=60000

# ===== 游标 =====
# 游标有效期（毫秒），过期后返回 CURSOR_EXPIRED
job.cursor-ttl-millis=300000
# 游标签名密钥（本地开发默认值，生产应覆盖）
job.cursor-secret=durable-job-local-dev-secret

# ===== 本地持久化 =====
# JSON 快照目录（无需外部数据库）；置空则纯内存
job.data-dir=data/jobstore
